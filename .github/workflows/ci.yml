name: CI

on:
  push:
    branches: ["main", "feature/cod-517-browser-pilot"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Install / Typecheck / Unit / Export / Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: SDK lockfile binding check
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const pkg = require('./package-lock.json').packages['node_modules/@techgod/iris-client'];
          assert.equal(pkg.version, '0.4.0');
          assert.equal(pkg.resolved, 'https://registry.npmjs.org/@techgod/iris-client/-/iris-client-0.4.0.tgz');
          assert.equal(pkg.integrity, 'sha512-ixP46xJWk8Tnd9gMkfoRsovEF0GcXkZ+ToY86aRzVOL+zBct2uWBhfB2OVgjLuidfUd/TJl6rsSW5wcWh+DWlg==');
          console.log('SDK lockfile binding verified; npm ci verifies downloaded package integrity');
          JS

      - name: Expo install coherence check
        run: npx expo install --check
        env:
          CI: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --runInBand

      - name: Web export (static)
        run: npm run build:web
        env:
          CI: "1"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests (fixture HTTP server)
        run: npx playwright test

      - name: npm audit (--omit=dev, document upstream)
        run: |
          # Audit prod deps only. Known upstream Expo transitive issues are
          # documented in README "Audit Blockers" section — no blind force-fix.
          npm audit --omit=dev --json > /tmp/audit.json || true
          node -e "
            const r = require('/tmp/audit.json');
            const v = r.metadata?.vulnerabilities ?? {};
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Dependency audit — unresolved release/deployment gate\\n' + JSON.stringify(v) + '\\nFunctional checks are not production security clearance. See README.\\n');
            console.log('Audit: critical=' + (v.critical||0) +
              ' high=' + (v.high||0) +
              ' moderate=' + (v.moderate||0) +
              ' low=' + (v.low||0));
            if ((v.critical||0) > 0) {
              console.error('FATAL: critical vulnerabilities in prod deps');
              process.exit(1);
            }
          "

  creed:
    name: Creed context drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go install github.com/techgodhq/creed@v0.4.1
      - run: creed validate && creed diff
